name: Build and Deploy

on:
  push:
    branches: [fork]
  workflow_dispatch:

permissions:
  contents: write # 允许 Actions 推送代码到仓库

env:
  NONAME_RESOURCE_KEY: ${{ secrets.NONAME_RESOURCE_KEY }}
  NONAME_RESOURCE_ROOT_URL: ${{ vars.NONAME_RESOURCE_ROOT_URL }}

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        env:
          NONAME_BUILD_CHANNEL: test
          NONAME_BUILD_COMMIT: ${{ github.sha }}
        run: |
          pnpm version:check
          pnpm test:distribution
          pnpm build

      - name: Deploy dist to branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-runtime.mjs build-output
