name: Release

on:
  push:
    tags:
      - "v*-c3nhx.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing fork version tag to release
        required: true
        type: string
      windows:
        description: Build Windows installer
        type: boolean
        default: true
      android:
        description: Build Android APK, requires signing secrets
        type: boolean
        default: false
      ios:
        description: Build experimental unsigned iOS IPA
        type: boolean
        default: false

concurrency:
  group: c3nhx-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  create-release:
    name: Draft Release
    runs-on: ubuntu-latest
    outputs:
      is_latest_release: ${{ steps.release-metadata.outputs.is_latest_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve release metadata
        id: release-metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/sync-release-version.mjs --check
          node --test scripts/tests/*.test.mjs
          node scripts/release-metadata.mjs "$RELEASE_TAG"

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_LATEST_RELEASE: ${{ steps['release-metadata'].outputs.is_latest_release }}
        run: |
          TAG="$RELEASE_TAG"
          RELEASE_ARGS=(
            --title "$TAG"
            --notes-file apps/core/game/updateLog.md
            --draft
            --verify-tag
            --prerelease=false
          )

          if [[ "$IS_LATEST_RELEASE" == "true" ]]; then
            RELEASE_ARGS+=(--latest)
          else
            RELEASE_ARGS+=(--latest=false)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$TAG" "${RELEASE_ARGS[@]}" --repo "$GITHUB_REPOSITORY"
          fi

  build-core:
    name: Build Core
    needs: create-release
    runs-on: ubuntu-latest
    env:
      NONAME_BUILD_CHANNEL: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core and full packages
        shell: bash
        run: |
          mkdir -p release
          pnpm build

          cd apps/core/dist
          7z a ../../../release/noname.core.zip *

          cd ../../../dist
          7z a ../release/noname.full.zip *

          cd ../release
          7z t noname.core.zip
          7z t noname.full.zip
          sha256sum noname.core.zip > noname.core.zip.sha256
          sha256sum noname.full.zip > noname.full.zip.sha256

      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"

          gh release upload "$TAG" \
          release/noname.core.zip \
          release/noname.core.zip.sha256 \
          release/noname.full.zip \
          release/noname.full.zip.sha256 \
          --clobber

      - name: Publish immutable compiled runtime
        run: node scripts/publish-runtime.mjs "runtime-$RELEASE_TAG"

  build-windows:
    name: Build Windows
    needs: create-release
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows }}
    runs-on: windows-latest
    env:
      NONAME_BUILD_CHANNEL: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare version
        shell: bash
        run: |
          VER="${RELEASE_TAG#v}"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Build Windows installer
        shell: bash
        run: |
          mkdir -p release
          pnpm build

          pnpm -F @noname/electron build:win
          EXE="$(find output -maxdepth 1 -name '*.exe' | head -n 1)"
          cp "$EXE" "release/noname.Setup.${VER}.exe"
          sha256sum "release/noname.Setup.${VER}.exe" > "release/noname.Setup.${VER}.exe.sha256"

      - name: Upload installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"

          gh release upload "$TAG" \
          "release/noname.Setup.${VER}.exe" \
          "release/noname.Setup.${VER}.exe.sha256" \
          --clobber

  build-android:
    name: Build Android
    needs: create-release
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.android) || (github.event_name != 'workflow_dispatch' && vars.RELEASE_ANDROID == 'true') }}
    runs-on: ubuntu-latest
    env:
      NONAME_BUILD_CHANNEL: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Make Gradle wrapper executable
        run: chmod +x apps/mobile/native/android/gradlew

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing GitHub Secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing GitHub Secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing GitHub Secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing GitHub Secret ANDROID_KEY_PASSWORD}"
          SIGNING_DIR="$RUNNER_TEMP/noname-android-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/noname-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$SIGNING_DIR/noname-release.jks" >> "$GITHUB_ENV"

      - name: Build signed Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release
          pnpm -F @noname/mobile build:android
          cp apps/mobile/native/android/app/build/outputs/apk/release/app-release.apk release/noname.android.apk
          sha256sum release/noname.android.apk > release/noname.android.apk.sha256

      - name: Upload Android packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          gh release upload "$TAG" \
            release/noname.android.apk \
            release/noname.android.apk.sha256 \
            --clobber

  build-ios:
    name: Build iOS
    needs: create-release
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.ios) || (github.event_name != 'workflow_dispatch' && vars.RELEASE_IOS == 'true') }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      NONAME_BUILD_CHANNEL: release

    steps:
      - name: Checkout repository (shallow)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Build noname
        run: pnpm build

      - name: Verify iOS Capacitor project
        run: test -f apps/mobile/native/ios/App/App.xcodeproj/project.pbxproj

      - name: Capacitor sync
        working-directory: apps/mobile
        run: pnpm sync:ios

      - name: Strip character art and voice
        working-directory: apps/mobile
        run: pnpm exec tsx scripts/strip-ios-assets.ts

      - name: Free disk
        run: rm -rf dist

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/native/ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build unsigned iOS app
        working-directory: apps/mobile/native/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            EXCLUDED_ARCHS="i386 x86_64" \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            -quiet \
            build

      - name: Package unsigned IPA
        id: package
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app"
          IPA_NAME="noname.ios.experimental"
          BUILD_DIR="$RUNNER_TEMP/ipa-build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR/Payload"
          cp -r "$APP_PATH" "$BUILD_DIR/Payload/"

          find "$BUILD_DIR/Payload" -name "._*" -delete || true

          cd "$BUILD_DIR"
          zip -qry "$IPA_NAME.ipa" Payload -x '*.DS_Store' -x '*/._*'

          shasum -a 256 "$IPA_NAME.ipa" > "$IPA_NAME.ipa.sha256"

          echo "ipa_path=$BUILD_DIR/$IPA_NAME.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload iOS package to release
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$IPA_PATH" \
            "$IPA_PATH.sha256" \
            --clobber

  release:
    name: Release Version
    runs-on: ubuntu-latest
    needs:
      - create-release
      - build-core
      - build-windows
      - build-android
      - build-ios
    if: ${{ always() && !cancelled() && needs.create-release.result == 'success' && needs.build-core.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.build-windows.result) && contains(fromJSON('["success","skipped"]'), needs.build-android.result) && contains(fromJSON('["success","skipped"]'), needs.build-ios.result) }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_LATEST_RELEASE: ${{ needs.create-release.outputs.is_latest_release }}
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease=false --latest="$IS_LATEST_RELEASE"
          if [[ "$IS_LATEST_RELEASE" == true ]]; then
            git fetch origin "refs/tags/runtime-$RELEASE_TAG"
            git push --force origin FETCH_HEAD:refs/heads/release-output
          fi

  cleanup-release:
    name: Clean Draft When Failure
    if: ${{ failure() }}
    needs:
      - create-release
      - build-core
      - build-windows
      - build-android
      - build-ios
      - release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Delete draft release on failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" == true ]]; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag=false
          fi
